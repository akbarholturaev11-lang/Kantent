    <script>

      window.__timelines["main"] = gsap.timeline({ paused: true });

      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-question", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 2.5);

        tl.to({}, { duration: 32.76 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
