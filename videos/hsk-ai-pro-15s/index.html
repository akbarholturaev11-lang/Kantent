<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FBF8EF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-course-access"
        class="scene"
        data-composition-id="01-course-access"
        data-composition-src="compositions/frames/01-course-access.html"
        data-start="0"
        data-duration="3.2"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-course-access-voice"
        src="assets/voiceover/segments/01.wav"
        data-start="0"
        data-duration="3.2"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-practice"
        class="scene"
        data-composition-id="02-practice"
        data-composition-src="compositions/frames/02-practice.html"
        data-start="3.2"
        data-duration="4.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-practice-voice"
        src="assets/voiceover/segments/02.wav"
        data-start="3.2"
        data-duration="4.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-ai-cta"
        class="scene"
        data-composition-id="03-ai-cta"
        data-composition-src="compositions/frames/03-ai-cta.html"
        data-start="7.7"
        data-duration="7.3"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-ai-cta-voice"
        src="assets/voiceover/segments/03.wav"
        data-start="7.7"
        data-duration="7.3"
        data-track-index="10"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
