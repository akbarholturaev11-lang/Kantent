name: Continuous Gemini TTS pilot (no API calls)

on:
  pull_request:
    paths:
      - '.github/workflows/continuous-gemini-tts-pilot.yml'
      - 'hsk-tu-vous/scripts/continuous-tts-plan.mjs'
      - 'hsk-tu-vous/scripts/continuous-tts-plan.test.mjs'
      - 'hsk-tu-vous/scripts/silence-clip-plan.mjs'
      - 'hsk-tu-vous/scripts/silence-clip-plan.test.mjs'
      - 'hsk-tu-vous/scripts/external-word-cue-gate.mjs'
      - 'hsk-tu-vous/scripts/external-word-cue-gate.test.mjs'
      - 'hsk-tu-vous/scripts/generate-voice-gemini.mjs'
      - 'hsk-tu-vous/content/WORKFLOW.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-tts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks (no API keys)
        run: |
          node --check scripts/continuous-tts-plan.mjs
          node --check scripts/continuous-tts-plan.test.mjs
          node --check scripts/silence-clip-plan.mjs
          node --check scripts/silence-clip-plan.test.mjs
          node --check scripts/external-word-cue-gate.mjs
          node --check scripts/external-word-cue-gate.test.mjs
          node --check scripts/generate-voice-gemini.mjs
      - name: Voice planner and source-word recovery regression tests
        run: node --test scripts/continuous-tts-plan.test.mjs scripts/silence-clip-plan.test.mjs scripts/external-word-cue-gate.test.mjs scripts/gemini-word-recovery.test.mjs
      - name: Install project dependencies
        run: npm ci
      - name: Project consistency
        run: npm run check:consistency
