name: HSK AI Tajik Telegram 3-day product news (text only)

# Daily 09:00 Asia/Shanghai check; code enforces a genuine 3-day cycle
# across month boundaries, beginning 2026-10-29. Zero sourced and
# owner-approved new updates means no external post, NOT fabricated news.
on:
  push:
    branches:
      - feat/zernio-verified-language-routing-20261028
    paths:
      - .github/workflows/telegram-product-news.yml
      - hsk-tu-vous/scripts/telegram-product-news.mjs
      - hsk-tu-vous/scripts/telegram-product-news.test.mjs
      - hsk-tu-vous/content/telegram-product-news.json
  pull_request:
    paths:
      - .github/workflows/telegram-product-news.yml
      - hsk-tu-vous/scripts/telegram-product-news.mjs
      - hsk-tu-vous/scripts/telegram-product-news.test.mjs
      - hsk-tu-vous/content/telegram-product-news.json
      - hsk-tu-vous/content/publication-destinations.json
      - hsk-tu-vous/scripts/video-credentials.mjs
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsk-tg-telegram-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exact calendar, language, approved copy, and account API guards
        run: |
          node --check scripts/telegram-product-news.mjs
          node --test scripts/telegram-product-news.test.mjs scripts/video-credentials.test.mjs
      - name: Preview due Tajik product update without publishing or inventing news
        run: node scripts/telegram-product-news.mjs preview

  send-approved-news:
    needs: validate-news
    if: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' && vars.HSK_TG_TELEGRAM_NEWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hsk-tg-telegram-news
    defaults:
      run:
        working-directory: hsk-tu-vous
    env:
      HSK_TG_TELEGRAM_NEWS_ENABLED: "true"
      ZERNIO_TIKTOK_TELEGRAM_API_KEY: ${{ secrets.ZERNIO_TIKTOK_TELEGRAM_API_KEY }}
      ZERNIO_TG_TELEGRAM_ACCOUNT_ID: ${{ vars.ZERNIO_TG_TELEGRAM_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish ONLY matching owner-approved sourced Tajik text to exact Telegram account
        run: node scripts/telegram-product-news.mjs send

# No video media. Separate from exact-video review and publication workflow.
# Enabling requires explicit owner-approved user-facing update queue entries,
# exact text SHA-256, live connected Zernio key and Actions variable switch.
