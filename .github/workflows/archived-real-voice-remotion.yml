name: Canonical Remotion archived real-voice RU/TJ review (no TTS)

on:
  pull_request:
    paths:
      - '.github/workflows/archived-real-voice-remotion.yml'
      - 'hsk-tu-vous/scripts/prepare-archived-voice-remotion.mjs'
      - 'hsk-tu-vous/scripts/prepare-archived-voice-remotion.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  canonical-real-voice-preview:
    name: Archived Kore ${{ matrix.language }} — canonical Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ru
            source_artifact: gemini-continuous-pr46-ru-41183287146
            baseline_artifact: hskai-safe-one-take-scene-review-ru-41191776589
          - language: tg
            source_artifact: gemini-continuous-pr46-tg-41183287146
            baseline_artifact: hskai-safe-one-take-scene-review-tg-41191776589
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original Gemini Kore WAV + dated source, no new audio generation
        uses: actions/download-artifact@v4
        with:
          run-id: 41183287146
          name: ${{ matrix.source_artifact }}
          github-token: ${{ github.token }}
          path: hsk-tu-vous/review
      - name: Restore previously verified measured scene-boundary evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 41191776589
          name: ${{ matrix.baseline_artifact }}
          github-token: ${{ github.token }}
          path: /tmp/archived-scene-baseline
      - name: Install canonical Remotion dependencies and production-compatible FFmpeg
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-dejavu-core
          node --test scripts/prepare-archived-voice-remotion.test.mjs
          npm run lint
      - name: Verify source hashes and prepare explicit unsynchronized review props
        run: |
          node scripts/prepare-archived-voice-remotion.mjs . ${{ matrix.language }} review /tmp/archived-scene-baseline/hsk-ai-${{ matrix.language }}-evidence.json /tmp/canonical-real-voice
          test -s /tmp/canonical-real-voice/${{ matrix.language }}-props.json
          test -s /tmp/canonical-real-voice/${{ matrix.language }}-evidence.json
      - name: Render WHOLE archived original voice on original HSKAI-Episode Remotion composition
        run: |
          npx remotion render src/index.ts HSKAI-Episode /tmp/canonical-real-voice/hsk-ai-${{ matrix.language }}-remotion-REVIEW-ONLY.mp4 \
            --props /tmp/canonical-real-voice/${{ matrix.language }}-props.json \
            --scale=0.6666666666666666 --codec=h264 --pixel-format=yuv420p --color-space=bt709 \
            --audio-codec=aac --concurrency=2 --log=error
          test -s /tmp/canonical-real-voice/hsk-ai-${{ matrix.language }}-remotion-REVIEW-ONLY.mp4
      - name: Validate actual audio/video streams, full voice length and make contact sheet
        run: |
          ffmpeg -hide_banner -loglevel error -i /tmp/canonical-real-voice/hsk-ai-${{ matrix.language }}-remotion-REVIEW-ONLY.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,nb_frames,duration -of json \
            /tmp/canonical-real-voice/hsk-ai-${{ matrix.language }}-remotion-REVIEW-ONLY.mp4 > /tmp/canonical-real-voice/${{ matrix.language }}-ffprobe.json
          python -m pip install --quiet pillow
          ffmpeg -hide_banner -loglevel error -i /tmp/canonical-real-voice/hsk-ai-${{ matrix.language }}-remotion-REVIEW-ONLY.mp4 \
            -vf 'fps=1/6,scale=270:480' -vsync vfr /tmp/canonical-real-voice/frame-%02d.png
          python - <<'PY'
          import os,json,hashlib,glob
          from PIL import Image,ImageDraw
          lang="${{ matrix.language }}"
          root="/tmp/canonical-real-voice"
          meta=json.load(open(f"{root}/{lang}-ffprobe.json"))
          report=json.load(open(f"{root}/{lang}-evidence.json"))
          video=next(s for s in meta["streams"] if s["codec_type"]=="video")
          audio=next(s for s in meta["streams"] if s["codec_type"]=="audio")
          assert video["codec_name"]=="h264" and audio["codec_name"]=="aac"
          assert int(video["width"])==720 and int(video["height"])==1280
          assert abs(float(video["duration"])-report["sourceDurationSec"])<.08
          assert abs(float(audio["duration"])-report["sourceDurationSec"])<.12
          frames=glob.glob(f"{root}/frame-*.png")
          assert len(frames)>=6, f"Too few actual preview frames: {len(frames)}"
          sheet=Image.new("RGB",(270*4,480*2),(19,23,30))
          for i,f in enumerate(sorted(frames)[:8]):
              im=Image.open(f).convert("RGB")
              sheet.paste(im,((i%4)*270,(i//4)*480))
          sheet.save(f"{root}/hsk-ai-{lang}-contact-sheet.jpg",quality=86)
          file=f"{root}/hsk-ai-{lang}-remotion-REVIEW-ONLY.mp4"
          report.update({"renderedMp4Sha256":hashlib.sha256(open(file,'rb').read()).hexdigest(),"ffprobe":meta,"actualSampleFrames":len(frames)})
          with open(f"{root}/{lang}-evidence.json","w") as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps({"language":lang,"sourceDuration":report["sourceDurationSec"],"videoDuration":video["duration"],"frames":video.get("nb_frames"),"status":report["status"]}))
          PY
      - name: Upload source-hash-backed nonpublishable video, screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-remotion-archived-kore-${{ matrix.language }}-${{ github.run_id }}
          path: |
            /tmp/canonical-real-voice/hsk-ai-${{ matrix.language }}-remotion-REVIEW-ONLY.mp4
            /tmp/canonical-real-voice/hsk-ai-${{ matrix.language }}-contact-sheet.jpg
            /tmp/canonical-real-voice/${{ matrix.language }}-evidence.json
            /tmp/canonical-real-voice/${{ matrix.language }}-ffprobe.json
          retention-days: 7
          if-no-files-found: warn
# This workflow does not publish, alter past source, create word timestamps, or regenerate voice.
