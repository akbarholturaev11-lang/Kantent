name: Canonical source consistency

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semantic-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check semantic contract, spoken word cues and legacy compatibility
        run: |
          node --check scripts/semantic-visual-plan.mjs
          node --check scripts/prepare-semantic-visual.mjs
          node --check scripts/mcp-server.mjs
          node --test scripts/semantic-visual-plan.test.mjs scripts/semantic-visual-cli.test.mjs scripts/semantic-shot-adviser.test.mjs scripts/semantic-review-integration.test.mjs
          node --test scripts/auto-storyboard.test.mjs
          node --check scripts/semantic-review-integration.mjs
          node --check scripts/semantic-planned-fixture.mjs
          node --check scripts/semantic-shot-adviser.mjs
          node --check scripts/preview-semantic-shots.mjs
          node scripts/preview-semantic-shots.mjs hui-vs-neng-pool-20261028 > /tmp/semantic-p3-plan.json
      - name: Validate active source references and config
        run: npm run check:consistency
      - name: Typecheck existing renderer and semantic opt-in preview
        run: npm ci --no-audit --no-fund && npm run lint
      - name: Verify real dated plan selects semantic renderer, not static school template
        run: |
          node scripts/semantic-planned-fixture.mjs /tmp/semantic-planned-props.json
          npx remotion still src/index.ts HSKAI-Episode /tmp/semantic-planned-hook.png --props /tmp/semantic-planned-props.json --frame=10
          npx remotion still src/index.ts HSKAI-Episode /tmp/semantic-planned-next.png --props /tmp/semantic-planned-props.json --frame=160
          test -s /tmp/semantic-planned-hook.png && test -s /tmp/semantic-planned-next.png
      - name: Install FFmpeg tools for full MP4 validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Real semantic Instagram/YouTube MP4 smoke with synthetic test tone
        run: node scripts/semantic-mp4-smoke.mjs /tmp/semantic-mp4-smoke
      - name: Render semantic come/go frames and confirm visual difference
        run: |
          node scripts/semantic-render-fixture.mjs /tmp/semantic-props.json
          npx remotion still src/index.ts HSKAI-Episode /tmp/semantic-before.png --props /tmp/semantic-props.json --frame=18
          npx remotion still src/index.ts HSKAI-Episode /tmp/semantic-approaching.png --props /tmp/semantic-props.json --frame=43
          npx remotion still src/index.ts HSKAI-Episode /tmp/semantic-arrived.png --props /tmp/semantic-props.json --frame=55
          npx remotion still src/index.ts HSKAI-Episode /tmp/semantic-departing.png --props /tmp/semantic-props.json --frame=86
          npx remotion still src/index.ts HSKAI-Episode /tmp/semantic-left.png --props /tmp/semantic-props.json --frame=107
          node --input-type=module -e "import fs from 'node:fs';import crypto from 'node:crypto';const names=['before','approaching','arrived','departing','left'];const hashes=names.map(n=>crypto.createHash('sha256').update(fs.readFileSync('/tmp/semantic-'+n+'.png')).digest('hex'));if(new Set(hashes).size!==hashes.length)throw Error('Semantic motion did not vary by cue frame');"

  consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check validator tests
        run: node --test scripts/check-consistency.test.mjs
      - name: Test task-to-skill routing
        run: node --test scripts/skill-router.test.mjs
      - name: Test all functional skill branches
        run: node --test scripts/skill-router.categories.test.mjs
      - name: Preview owner-authorized cinematic recut CTA registration
        run: node scripts/preview-recut-cta.mjs
      - name: Test CTA-free lesson plans and central CTA hydration
        run: node --test scripts/episode-cta-assembly.test.mjs
      - name: Test CTA variants and immutable CTA ledger
        run: node --test scripts/platform-cta.test.mjs scripts/cta-lab.test.mjs
      - name: Test timezone-aware today-video selection and verified published deduplication
        run: node --test scripts/resolve-production-date.test.mjs scripts/published-evidence.test.mjs
      - name: Test future episode buffer audit
        run: node --test scripts/self-improvement-check.test.mjs
      - name: Test 30-day canonical Hook Lab decisions
        run: node --test scripts/hook-lab-rolling.test.mjs
      - name: Test Zernio feedback analyzer and source snapshots
        run: node --test scripts/feedback-analyzer.test.mjs && npm run content:feedback -- --json > /tmp/feedback-report.json
      - name: Validate four-format content pilot and read-only planning
        run: node --test scripts/viral-plan.test.mjs && npm run content:viral-plan -- --date 2026-10-11 --json > /tmp/viral-plan.json && node --check scripts/viral-plan.mjs
      - name: Test storyboard safety and centralized CTA compatibility
        run: node --test scripts/storyboard-validation.test.mjs scripts/auto-storyboard.test.mjs
      - name: Install Remotion dependencies and typecheck cinematic renderer
        run: npm ci --no-audit --no-fund && npm run lint
      - name: Generate multi-format visual stills without publishing
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {getPlannedEpisode} from './scripts/lib.mjs'; for (const date of ['2026-10-14','2026-10-16','2026-10-19']) {const {episode}=await getPlannedEpisode(date);fs.writeFileSync('/tmp/story-'+date+'.json',JSON.stringify({episode}));}"
          npx remotion still src/index.ts HSKAI-Episode /tmp/quiz.png --props /tmp/story-2026-10-14.json --frame=35
          npx remotion still src/index.ts HSKAI-Episode /tmp/series.png --props /tmp/story-2026-10-16.json --frame=35
          npx remotion still src/index.ts HSKAI-Episode /tmp/fix.png --props /tmp/story-2026-10-19.json --frame=35
          test -s /tmp/quiz.png && test -s /tmp/series.png && test -s /tmp/fix.png
      - name: Render NEW owner-authorized cinematic pilot preview frames
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {getPlannedEpisode} from './scripts/lib.mjs';import {validateCtaEpisode,readCtaLab} from './scripts/cta-lab.mjs';const {episode}=await getPlannedEpisode('2026-10-13');const lab=await readCtaLab();const cta=episode.scenes.at(-1);const validation=validateCtaEpisode(episode,lab);if(episode.id!=='zai-location-cinematic-v2'||episode.creativeFormatId!=='street-situation'||cta?.kind!=='cta'||cta.narration!==lab.offer.canonicalRussian||episode.cta!==lab.offer.canonicalRussian)throw Error('Pilot plan/CTA hydration invalid');if(episode.ctaExperiment&&!validation.valid)throw Error('Stale pilot CTA registration was reused');if(!episode.ctaExperiment&&!validation.errors.some(error=>error.includes('Register this CTA')))throw Error('Unregistered pilot must require a new CTA registration');fs.writeFileSync('/tmp/zai-recut-preview-props.json',JSON.stringify({episode}));"
          npx remotion still src/index.ts HSKAI-Episode /tmp/zai-recut-hook.png --props /tmp/zai-recut-preview-props.json --frame=15
          npx remotion still src/index.ts HSKAI-Episode /tmp/zai-recut-home.png --props /tmp/zai-recut-preview-props.json --frame=330
          test -s /tmp/zai-recut-hook.png && test -s /tmp/zai-recut-home.png
      - name: Render visual-only cinematic storyboard stills
        run: |
          node -e "const fs=require('fs');const episode=require('./content/episodes/zai-location.json');fs.writeFileSync('/tmp/hsk-storyboard-props.json', JSON.stringify({episode}));"
          npx remotion still src/index.ts HSKAI-Episode /tmp/zai-hook.png --props /tmp/hsk-storyboard-props.json --frame=15
          npx remotion still src/index.ts HSKAI-Episode /tmp/zai-home.png --props /tmp/hsk-storyboard-props.json --frame=330
      - name: Check locally rendered storyboard frames
        run: |
          test -s /tmp/zai-hook.png
          test -s /tmp/zai-home.png
          file /tmp/zai-hook.png /tmp/zai-home.png
      - name: Test source freshness guards
        run: node --test scripts/git-freshness.test.mjs && node --check scripts/git-freshness.mjs
      - name: Test scenario buffer date proposals
        run: node --test scripts/scenario-buffer-plan.test.mjs && npm run content:scenario-buffer -- --json > /tmp/scenario-proposal.json
      - name: Parse MCP server
        run: node --check scripts/mcp-server.mjs
      - name: Verify canonical files and avoid duplicated active settings
        run: npm run check:consistency
