name: Canonical source consistency

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check validator tests
        run: node --test scripts/check-consistency.test.mjs
      - name: Verify canonical files and avoid duplicated active settings
        run: npm run check:consistency
