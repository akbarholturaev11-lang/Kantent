name: Canonical source consistency

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check validator tests
        run: node --test scripts/check-consistency.test.mjs
      - name: Test task-to-skill routing
        run: node --test scripts/skill-router.test.mjs
      - name: Test all functional skill branches
        run: node --test scripts/skill-router.categories.test.mjs
      - name: Test CTA-free lesson plans and central CTA hydration
        run: node --test scripts/episode-cta-assembly.test.mjs
      - name: Test CTA variants and immutable CTA ledger
        run: node --test scripts/platform-cta.test.mjs scripts/cta-lab.test.mjs
      - name: Test timezone-aware today-video selection
        run: node --test scripts/resolve-production-date.test.mjs
      - name: Test future episode buffer audit
        run: node --test scripts/self-improvement-check.test.mjs
      - name: Test 30-day canonical Hook Lab decisions
        run: node --test scripts/hook-lab-rolling.test.mjs
      - name: Test Zernio feedback analyzer and source snapshots
        run: node --test scripts/feedback-analyzer.test.mjs && npm run content:feedback -- --json > /tmp/feedback-report.json
      - name: Validate four-format content pilot and read-only planning
        run: node --test scripts/viral-plan.test.mjs && npm run content:viral-plan -- --date 2026-10-11 --json > /tmp/viral-plan.json && node --check scripts/viral-plan.mjs
      - name: Test source freshness guards
        run: node --test scripts/git-freshness.test.mjs && node --check scripts/git-freshness.mjs
      - name: Test scenario buffer date proposals
        run: node --test scripts/scenario-buffer-plan.test.mjs && npm run content:scenario-buffer -- --json > /tmp/scenario-proposal.json
      - name: Parse MCP server
        run: node --check scripts/mcp-server.mjs
      - name: Verify canonical files and avoid duplicated active settings
        run: npm run check:consistency
