name: One-shot offline Qwen Chinese/Russian acoustic probe (PR 46)

# Explicit owner-initiated review transition, not a push/schedule/publish job.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  qwen-evidence:
    if: >-
      ${{ github.event.pull_request.number == 46 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/continuous-gemini-tts-pilot-20261031' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hsk-tu-vous
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuous-gemini-tts-pilot-20261031
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          run-id: 41183287146
          name: gemini-continuous-pr46-ru-41183287146
          github-token: ${{ github.token }}
          path: hsk-tu-vous/review/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original WAV and stage offline model test
        run: |
          python -m pip install --quiet numpy soundfile
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("review/youdianr-vs-yidianr-price-20261030/gemini-production/2026-10-31T08-07-45-724Z/voice.wav")
          assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()=="562c368a0dd5800f11da724a54480797631ed141625bcabba248111184cc652c"
          print("Verified archived RU WAV; no TTS will be used.")
          PY
      - name: Install Qwen3 ForcedAligner on CPU, Apache-2.0
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet qwen-asr
      - name: Read-only model acoustic time-stamp probe (not published/accepted)
        run: |
          python scripts/qwen-one-take-probe.py \
            --wav review/youdianr-vs-yidianr-price-20261030/gemini-production/2026-10-31T08-07-45-724Z/voice.wav \
            --episode review/youdianr-vs-yidianr-price-20261030/episode.json \
            --out /tmp/hsk-align-probe/ru-zh-diagnostic.json
      - name: Upload acoustic diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-ru-zh-acoustic-probe-${{ github.run_id }}
          path: /tmp/hsk-align-probe/
          if-no-files-found: warn
          retention-days: 7
