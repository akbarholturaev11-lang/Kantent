name: One-shot saved-audio Gemini word-cue diagnosis (PR 46)

# Owner-triggered by ready-for-review event ONLY. No TTS calls allowed.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  saved-audio-recovery:
    if: >-
      ${{ github.event.pull_request.number == 46 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/continuous-gemini-tts-pilot-20261031' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1  # Stay within the shared provider/project's request-rate budget.
      matrix:
        include:
          - language: ru
            folder: 2026-10-31T08-07-45-724Z
            artifact: gemini-continuous-pr46-ru-41183287146
          - language: tg
            folder: 2026-10-31T08-07-45-540Z
            artifact: gemini-continuous-pr46-tg-41183287146
    defaults:
      run:
        working-directory: hsk-tu-vous
    env:
      HSK_CONTENT_LANGUAGE: ${{ matrix.language }}
      HSK_AI_CONTINUOUS_TTS_PILOT: 'true'
      HSK_AI_CONTINUOUS_TTS_RESUME_ONLY: 'true'
      EPISODE_ID: youdianr-vs-yidianr-price-20261030
      RESUME_FOLDER: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuous-gemini-tts-pilot-20261031
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hsk-tu-vous/package-lock.json
      - name: Download original Gemini WAV/metadata from PR 46 first audition
        uses: actions/download-artifact@v4
        with:
          run-id: 41183287146
          name: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: hsk-tu-vous/review/
      - name: Install runtime and verify no TTS can be called
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node --check scripts/generate-voice-gemini.mjs
          node --test scripts/continuous-tts-plan.test.mjs scripts/silence-clip-plan.test.mjs scripts/gemini-word-recovery.test.mjs
          test "$(git symbolic-ref --short HEAD)" = "feat/continuous-gemini-tts-pilot-20261031"
          if [[ "$HSK_CONTENT_LANGUAGE" == "tg" ]]; then ROOT="review/$EPISODE_ID/tg"; else ROOT="review/$EPISODE_ID"; fi
          test -s "$ROOT/gemini-production/$RESUME_FOLDER/voice.wav"
          test -s "$ROOT/gemini-production/$RESUME_FOLDER/voice.mp3"
          node --input-type=module -e '
          import fs from "node:fs";
          const base=process.env.HSK_CONTENT_LANGUAGE==="tg"
             ? "review/"+process.env.EPISODE_ID+"/tg" : "review/"+process.env.EPISODE_ID;
          const m=JSON.parse(fs.readFileSync(base+"/gemini-production/"+process.env.RESUME_FOLDER+"/metadata.json","utf8"));
          if(m.ttsRequestCount!==1 || m.ttsGenerationMode!=="continuous-pilot")
            throw Error("Saved voice provenance/one-take count incorrect.");
          '
      - name: Reuse WAV, retry ONLY same-model word transcription/recovery
        id: recover
        continue-on-error: true
        env:
          HSK_AI_ALLOW_GEMINI_API: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP_1: ${{ secrets.GEMINI_API_KEY_BACKUP_1 }}
          GEMINI_API_KEY_BACKUP_2: ${{ secrets.GEMINI_API_KEY_BACKUP_2 }}
          GEMINI_API_KEY_BACKUP_3: ${{ secrets.GEMINI_API_KEY_BACKUP_3 }}
        run: npm run content:voice -- "$EPISODE_ID" --resume "$RESUME_FOLDER"
      - name: Report archived outcome without secrets
        if: always()
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const base=process.env.HSK_CONTENT_LANGUAGE==="tg"
             ? "review/"+process.env.EPISODE_ID+"/tg" : "review/"+process.env.EPISODE_ID;
          const file=base+"/gemini-production/"+process.env.RESUME_FOLDER+"/metadata.json";
          const m=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,"utf8")):{};
          const report={lang:process.env.HSK_CONTENT_LANGUAGE,stage:m.status,
             ttsRequestCount:m.ttsRequestCount,ttsGenerationMode:m.ttsGenerationMode,
             transcriptionAttempts:m.transcriptionAttempts,
             silenceRecoveryClips:m.silenceRecoveryClips?.length??0,
             recoveredClips:m.recoveredClips?.length??0,
             captionWordCount:m.captionWordCount,
             error:m.error??m.lastSilenceRecoveryError??m.lastRecoveryError??null};
          console.log(JSON.stringify(report));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n~~~json\n"+JSON.stringify(report,null,2)+"\n~~~\n");
          '
      - name: Upload verified audio, transcripts, silence clips and exact-cue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-resumed-pr46-${{ matrix.language }}-${{ github.run_id }}
          path: hsk-tu-vous/review/
          if-no-files-found: warn
          retention-days: 7
      - name: Require verified exact-word audio import
        if: always()
        run: test "${{ steps.recover.outcome }}" = "success"

# No TTS calls, no publishing, no Zernio credentials, no branch write.
