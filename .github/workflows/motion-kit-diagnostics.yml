name: MotionKit scoped diagnostic report
on:
  push:
    branches:
      - planning/full-ui-motion-library-20261115
    paths:
      - .github/workflows/motion-kit-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/planning/full-ui-motion-library-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hsk-tu-vous/package-lock.json
      - name: Diagnose and record compact build error (no secrets)
        shell: bash
        run: |
          set -u
          cd hsk-tu-vous
          npm ci > /tmp/install-output 2>&1
          i=$?
          npm run lint > /tmp/lint-output 2>&1
          l=$?
          node --test scripts/video-component-selector.test.mjs > /tmp/selector-output 2>&1
          t=$?
          npm run check:consistency > /tmp/consistency-output 2>&1
          c=$?
          {
            printf '# MotionKit diagnostic (planning branch only)\n\n'
            printf 'npm ci exit: %s\n\n' "$i"
            printf 'npm run lint exit: %s\n\n' "$l"
            printf 'node --test selector exit: %s\n\n' "$t"
            printf 'npm run check:consistency exit: %s\n\n' "$c"
            for name in lint selector consistency; do
              printf '\n## %s (last 85 lines)\n\n```text\n' "$name"
              tail -n 85 "/tmp/${name}-output" | sed -E 's/\x1B\[[0-9;]*[mK]//g'
              printf '```\n'
            done
          } > docs/audits/MOTION_KIT_DIAGNOSTIC.md
          git add docs/audits/MOTION_KIT_DIAGNOSTIC.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(content): capture scoped MotionKit CI diagnostics"
            git push origin HEAD:refs/heads/planning/full-ui-motion-library-20261115
          fi
