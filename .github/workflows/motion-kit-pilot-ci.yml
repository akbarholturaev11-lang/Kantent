name: MotionKit isolated demo CI

on:
  push:
    branches:
      - main
      - planning/full-ui-motion-library-20261115
    paths:
      - .github/workflows/motion-kit-pilot-ci.yml
      - hsk-tu-vous/scripts/video-component-selector*
      - hsk-tu-vous/scripts/motion-kit-cue-plan*
      - hsk-tu-vous/scripts/codex-motionkit-*
      - hsk-tu-vous/content/WORKFLOW.md
      - hsk-tu-vous/content/EDITING_SPEC.md
      - hsk-tu-vous/AGENTS.md
      - hsk-tu-vous/package.json
      - hsk-tu-vous/scripts/motion-kit-optin-fixture.mjs
      - hsk-tu-vous/scripts/render-platform-videos.mjs
      - hsk-tu-vous/scripts/render-episode.mjs
      - hsk-tu-vous/src/EpisodeComposition.tsx
      - hsk-tu-vous/src/IllustratedLessonScene.tsx
      - hsk-tu-vous/scripts/preview-video-component-plan*
      - hsk-tu-vous/tsconfig.json
      - hsk-tu-vous/content/skill-catalog.json
      - hsk-tu-vous/src/video-components/**
      - hsk-tu-vous/src/motion-kit-preview/**
  pull_request:
    paths:
      - hsk-tu-vous/scripts/codex-motionkit-*
      - hsk-tu-vous/scripts/motion-kit-cue-plan*
      - hsk-tu-vous/src/video-components/**
      - hsk-tu-vous/src/EpisodeComposition.tsx
      - hsk-tu-vous/src/IllustratedLessonScene.tsx
      - .github/workflows/motion-kit-pilot-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-kit-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hsk-tu-vous/package-lock.json
      - name: Install pinned project dependencies
        run: npm ci
      - name: TypeScript and ESLint
        run: npm run lint
      - name: Deterministic selector tests
        run: node --test scripts/video-component-selector.test.mjs scripts/preview-video-component-plan.test.mjs scripts/motion-kit-cue-plan.test.mjs scripts/codex-motionkit-test.test.mjs
      - name: Advisory plan smoke on current real source (no production mutation)
        run: |
          mkdir -p .motion-kit-pilot-output
          node scripts/preview-video-component-plan.mjs shop-shirt-size-20261117 > .motion-kit-pilot-output/advertisement-plan.json
          node scripts/preview-video-component-plan.mjs ji-vs-duoshao-books-price-20261118 > .motion-kit-pilot-output/lesson-plan.json
      - name: Automatically surface Codex TEST brief, verify it cannot activate AI API
        run: |
          node scripts/codex-motionkit-test.mjs ji-vs-duoshao-books-price-20261118 --language=ru > .motion-kit-pilot-output/codex-test-status-ru.json
          node scripts/codex-motionkit-test.mjs ji-vs-duoshao-books-price-20261118 --language=tg > .motion-kit-pilot-output/codex-test-status-tg.json
          node --input-type=module -e "import fs from 'node:fs';for(const lang of ['ru','tg']){const p=JSON.parse(fs.readFileSync('.motion-kit-pilot-output/codex-test-status-'+lang+'.json'));if(p.mode!=='TEST_ONLY'||p.language!==lang||p.selectionOwner!=='Codex'||p.aiApiConnected!==false||p.productionEffectsEnabled!==false)throw Error('Not a safe language-scoped Codex TEST: '+lang)}"
          test -s review/motion-kit-tests/ji-vs-duoshao-books-price-20261118/ru/brief.json
          test -s review/motion-kit-tests/ji-vs-duoshao-books-price-20261118/tg/brief.json
          cp review/motion-kit-tests/ji-vs-duoshao-books-price-20261118/ru/brief.json .motion-kit-pilot-output/codex-test-brief-ru.json
          cp review/motion-kit-tests/ji-vs-duoshao-books-price-20261118/tg/brief.json .motion-kit-pilot-output/codex-test-brief-tg.json
      - name: Project consistency
        run: npm run check:consistency
      - name: Build three exact synthetic frames and silent demo MP4
        run: |
          set -euo pipefail
          mkdir -p .motion-kit-pilot-output
          npx remotion still src/motion-kit-preview/index.tsx MotionKitPilot .motion-kit-pilot-output/frame-0.png --frame=0 --log=error
          npx remotion still src/motion-kit-preview/index.tsx MotionKitPilot .motion-kit-pilot-output/frame-79.png --frame=79 --log=error
          npx remotion still src/motion-kit-preview/index.tsx MotionKitPilot .motion-kit-pilot-output/frame-160.png --frame=160 --log=error
          npx remotion render src/motion-kit-preview/index.tsx MotionKitPilot .motion-kit-pilot-output/motion-kit-pilot.mp4 --codec=h264 --log=error

      - name: Test actual HSKAI-Episode frame with and without optional cue-bound art
        run: |
          set -euo pipefail
          mkdir -p .motion-kit-pilot-output/bound
          node scripts/motion-kit-optin-fixture.mjs .motion-kit-pilot-output/bound
          npx remotion still src/index.ts HSKAI-Episode .motion-kit-pilot-output/bound/baseline-6.png --props .motion-kit-pilot-output/bound/baseline.json --frame=6 --log=error
          npx remotion still src/index.ts HSKAI-Episode .motion-kit-pilot-output/bound/candidate-6.png --props .motion-kit-pilot-output/bound/candidate.json --frame=6 --log=error
          node --input-type=module -e "import fs from 'node:fs';import crypto from 'node:crypto';const root='.motion-kit-pilot-output/bound/';const hash=n=>crypto.createHash('sha256').update(fs.readFileSync(root+n+'.png')).digest('hex');if(hash('baseline-6')===hash('candidate-6'))throw Error('Opt-in MotionKit did not alter selected art layer at cue frame');console.log('Synthetic cue-frame render changed only when opt-in prop was present');"
      - name: Upload silent technical pilot for owner visual review
        uses: actions/upload-artifact@v4
        with:
          name: motion-kit-pilot-unapproved
          path: hsk-tu-vous/.motion-kit-pilot-output/
          retention-days: 7
