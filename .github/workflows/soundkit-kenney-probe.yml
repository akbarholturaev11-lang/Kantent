name: SoundKit Kenney CC0 publisher-archive probe (isolated)

on:
  push:
    branches:
      - feat/sound-design-phase0-kenney-audit-20261115
    paths:
      - .github/workflows/soundkit-kenney-probe.yml
      - hsk-tu-vous/scripts/kenney-sound-probe.py
      - hsk-tu-vous/scripts/kenney_sound_probe_test.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soundkit-kenney-probe
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run no-network safety tests
        run: python -m unittest discover -s scripts -p 'kenney_sound_probe_test.py' -v
      - name: Verify ffprobe available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1
      - name: Probe only publisher-hosted CC0 ZIPs, not import assets
        run: |
          set +e
          python scripts/kenney-sound-probe.py --report docs/audits/SOUNDKIT_KENNEY_ARCHIVE_PROBE.json
          code=$?
          echo "$code" > .soundkit-kenney-probe-exit
          echo "Archive probe exit: $code"
          exit 0
      - name: Preserve official source audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundkit-kenney-official-archive-probe
          path: hsk-tu-vous/docs/audits/SOUNDKIT_KENNEY_ARCHIVE_PROBE.json
          retention-days: 14
          if-no-files-found: warn
      - name: Commit factual probe report to this isolated branch only
        run: |
          set -euo pipefail
          test -f docs/audits/SOUNDKIT_KENNEY_ARCHIVE_PROBE.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/SOUNDKIT_KENNEY_ARCHIVE_PROBE.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(content): record official Kenney ZIP provenance result [skip ci]"
            git push origin HEAD:feat/sound-design-phase0-kenney-audit-20261115
          fi
      - name: Enforce honest download and license outcome
        run: |
          test "$(cat .soundkit-kenney-probe-exit)" -eq 0
