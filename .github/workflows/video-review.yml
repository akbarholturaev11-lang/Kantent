  workflow_dispatch:
    inputs:
      episode:
        description: "Canonical date (YYYY-MM-DD), episode ID, or today"
        required: true
        type: string
        default: today
      language:
        description: "Production languages; each has its own real audio, CTA and MP4"
        required: true
        type: choice
        options:
          - all
          - ru
          - tg
        default: all
  # Disabled until HSK_VIDEO_SCHEDULE_ENABLED is explicitly set to true
  # in repository Actions variables after owner review and merge.
  schedule:
    - cron: "0 0 * * 1,3,5"  # 08:00 Asia/Shanghai, Mon/Wed/Fri

permissions:
  contents: read

concurrency:
  group: hsk-video-review-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.episode || 'calendar' }}
  cancel-in-progress: false

jobs:
  safe-ci:
    name: Test request guards and real synthetic MP4 packaging (NO Gemini)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hsk-tu-vous/package-lock.json
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Check pipeline scripts and canonical files
        run: |
          node --check scripts/github-video-pipeline.mjs
          node --check scripts/github-video-pipeline.test.mjs
          node --check scripts/video-credentials.mjs
          node --check scripts/video-credentials.test.mjs
          node --check scripts/generate-voice-gemini.mjs
          node --check scripts/voice-checkpoint.mjs
          node --check scripts/voice-checkpoint-artifact.mjs
          node --check scripts/voice-import-state.mjs
          node --check scripts/openrouter-voice.mjs
          node --check scripts/import-voice.mjs
          node --check scripts/media-duration.mjs
          node --check scripts/voice-caption-boundary.mjs
          node --check scripts/cue-timeline.mjs
          node --check scripts/compile-cue-timeline.mjs
          node --check scripts/narrated-beat-state.mjs
          node --check scripts/render-episode.mjs
          node --check scripts/render-tiktok-review.mjs
          node --check scripts/render-platform-videos.mjs
          node --check scripts/make-episode.mjs
          node --check scripts/mcp-server.mjs
          node --check scripts/caption-utils.mjs
          node --check scripts/openrouter-voice.test.mjs
          node --check scripts/gemini-word-recovery.mjs
          node --check scripts/gemini-word-recovery.test.mjs
          node --check scripts/zernio-publication-core.mjs
          node --check scripts/zernio-publication-core.test.mjs
          node --check scripts/zernio-approved-publish.mjs
          node --check scripts/zernio-approved-publish.test.mjs
          node --test scripts/gemini-word-recovery.test.mjs scripts/openrouter-voice.test.mjs scripts/voice-checkpoint.test.mjs scripts/voice-checkpoint-artifact.test.mjs scripts/voice-import-state.test.mjs scripts/voice-reuse-integration.test.mjs scripts/media-duration.test.mjs scripts/voice-caption-boundary.test.mjs scripts/caption-utils.test.mjs scripts/cue-timeline.test.mjs scripts/narrated-beat-state.test.mjs scripts/cta-current-registration.test.mjs scripts/both-allowed-state.test.mjs scripts/action-design-plan.test.mjs scripts/motion-design-plan.test.mjs scripts/promo-production.test.mjs scripts/platform-exports.test.mjs scripts/semantic-review-integration.test.mjs scripts/cta-mcp.test.mjs
          npm run check:consistency
      - name: Install FFmpeg and FFprobe for real synthetic MP4 tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -n 1
      - name: Test exact-date safety, isolation and actual FFmpeg MP4/SRT verification
        run: node --test scripts/github-video-pipeline.test.mjs scripts/video-credentials.test.mjs scripts/zernio-publication-core.test.mjs scripts/zernio-approved-publish.test.mjs

  render-review:
    name: Approved Gemini voices via selected API -> verified private review artifact
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && vars.HSK_VIDEO_SCHEDULE_ENABLED == 'true')
      }}
    needs: safe-ci
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    defaults:
      run:
        working-directory: hsk-tu-vous
    env:
      HSK_AI_VOICE_API_PROVIDER: ${{ vars.HSK_AI_VOICE_API_PROVIDER || 'openrouter' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HSK_AI_ALLOW_GEMINI_API: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_BACKUP_1: ${{ secrets.GEMINI_API_KEY_BACKUP_1 }}
      GEMINI_API_KEY_BACKUP_2: ${{ secrets.GEMINI_API_KEY_BACKUP_2 }}
      GEMINI_API_KEY_BACKUP_3: ${{ secrets.GEMINI_API_KEY_BACKUP_3 }}
      # HTTP 429 quota limits are never bypassed by rotating Google accounts.
      REQUESTED_EPISODE: ${{ github.event.inputs.episode || 'today' }}
      REQUESTED_LANGUAGE: ${{ github.event.inputs.language || 'all' }}
      CI_PACKAGE_DIR: /tmp/hsk-ai-video-review
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hsk-tu-vous/package-lock.json
      - name: Check selected voice API credential without exposing it
        run: |
          if [[ "$HSK_AI_VOICE_API_PROVIDER" == "openrouter" ]]; then
            if [[ -z "$OPENROUTER_API_KEY" ]]; then
              echo "::error::Set OPENROUTER_API_KEY in GitHub Actions secrets for primary voice production."
              exit 1
            fi
          elif [[ "$HSK_AI_VOICE_API_PROVIDER" == "gemini-direct" ]]; then
            if [[ -z "$GEMINI_API_KEY" && -z "$GEMINI_API_KEY_BACKUP_1" && -z "$GEMINI_API_KEY_BACKUP_2" && -z "$GEMINI_API_KEY_BACKUP_3" ]]; then
              echo "::error::Direct Gemini selected but no Gemini credential exists."
              exit 1
            fi
          else
            echo "::error::Invalid HSK_AI_VOICE_API_PROVIDER."
            exit 1
          fi
      - name: Install production dependencies
        run: npm ci --no-audit --no-fund
      - name: Install FFmpeg and FFprobe for real production MP4 validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Resolve exact lesson and fail closed for protected approved audio
        id: episode
        run: node scripts/github-video-pipeline.mjs resolve "$REQUESTED_EPISODE" "$REQUESTED_LANGUAGE"
      - name: Restore unapproved voice recovery data from this workflow run
        if: github.run_attempt > 1
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hsk-voice-recovery-${{ steps.episode.outputs.episode_id }}-${{ github.run_id }}
          path: hsk-tu-vous
      - name: Use selected voice API and verified word-cue Remotion pipeline
        id: make
        env:
          EPISODE_ID: ${{ steps.episode.outputs.episode_id }}
        run: npm run content:make -- "$EPISODE_ID" --language "$REQUESTED_LANGUAGE"
      - name: Prepare hash-verified recovery data after a failed render attempt
        id: recovery
        if: failure() && steps.episode.outcome == 'success'
        env:
          EPISODE_ID: ${{ steps.episode.outputs.episode_id }}
        run: node scripts/voice-checkpoint-artifact.mjs package "$EPISODE_ID" /tmp/hsk-ai-voice-recovery
      - name: Preserve unapproved voice recovery data for a workflow rerun
        if: failure() && steps.recovery.outcome == 'success' && steps.recovery.outputs.files != '0'
        uses: actions/upload-artifact@v4
        with:
          name: hsk-voice-recovery-${{ steps.episode.outputs.episode_id }}-${{ github.run_id }}
          path: /tmp/hsk-ai-voice-recovery/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Verify and isolate both platform MP4s per language (no publishing)
        env:
          EPISODE_ID: ${{ steps.episode.outputs.episode_id }}
        run: node scripts/github-video-pipeline.mjs package "$EPISODE_ID" "$REQUESTED_LANGUAGE" "$CI_PACKAGE_DIR"
      - name: Write immutable review manifest summary
        run: |
          {
            echo "### HSK AI generated review package"
            echo "All MP4 files remain **unapproved and unpublished**."
            echo "The manifest holds language/platform-specific SHA-256 hashes."
            echo "Inspect actual video, narration, captions, CTA and Zernio account/time before approving a post."
            echo
            echo '~~~json'
            cat "$CI_PACKAGE_DIR/manifest.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified review videos (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: hsk-review-${{ steps.episode.outputs.episode_id }}-${{ github.run_id }}
          path: /tmp/hsk-ai-video-review/
          if-no-files-found: error
          retention-days: 7

# Deliberately NO github write permission, Zernio credentials, API calls to
# social networks, approval token or publication job. Exact owner approval
# of each language/platform preview is required outside this workflow.
