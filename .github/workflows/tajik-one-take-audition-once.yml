name: One-shot Tajik offline ASR timepoint probe (PR 46)

# Diagnostic-only Apache-2.0 Tajik recognizer. No paid API, no TTS, no publishing.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  tajik-evidence:
    if: >-
      ${{ github.event.pull_request.number == 46 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/continuous-gemini-tts-pilot-20261031' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hsk-tu-vous
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuous-gemini-tts-pilot-20261031
      - uses: actions/download-artifact@v4
        with:
          run-id: 41183287146
          name: gemini-continuous-pr46-tg-41183287146
          github-token: ${{ github.token }}
          path: hsk-tu-vous/review/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tajik ASR offline dependencies (no Gemini key)
        run: python -m pip install --quiet 'sherpa-onnx' 'huggingface-hub' 'numpy'
      - name: Decode real approved original Tajik WAV with original token times
        run: |
          python scripts/tajik-vosk-one-take-probe.py \
            --wav review/youdianr-vs-yidianr-price-20261030/tg/gemini-production/2026-10-31T08-07-45-540Z/voice.wav \
            --episode review/youdianr-vs-yidianr-price-20261030/tg/episode.json \
            --out /tmp/hsk-tajik-probe/tajik-asr-diagnostic.json
      - name: Archive diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tajik-vosk-asr-audition-${{ github.run_id }}
          path: /tmp/hsk-tajik-probe/
          retention-days: 7
          if-no-files-found: warn
