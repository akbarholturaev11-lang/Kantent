name: SoundKit pinned CC0 library integrity CI (read-only)

on:
  push:
    branches:
      - main
      - feat/sound-design-phase0-kenney-audit-20261115
    paths:
      - .github/workflows/soundkit-kenney-mirror-import.yml
      - hsk-tu-vous/scripts/kenney-mirror-import.py
      - hsk-tu-vous/scripts/kenney_mirror_import_test.py
      - hsk-tu-vous/vendor-catalog/soundkit/kenney-mirror-lock.json
      - hsk-tu-vous/content/sound-library.json
      - hsk-tu-vous/assets/sound-library/**
  pull_request:
    paths:
      - .github/workflows/soundkit-kenney-mirror-import.yml
      - hsk-tu-vous/scripts/kenney-mirror-import.py
      - hsk-tu-vous/scripts/kenney_mirror_import_test.py
      - hsk-tu-vous/vendor-catalog/soundkit/kenney-mirror-lock.json
      - hsk-tu-vous/content/sound-library.json
      - hsk-tu-vous/assets/sound-library/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soundkit-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source lock and ZIP safety tests (no network)
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'kenney_sound_probe_test.py' -v
          python -m unittest discover -s scripts -p 'kenney_mirror_import_test.py' -v
      - name: Verify all 151 imported WAV SHA-256 plus locked Git hashes and CC0 licenses
        run: |
          set -euo pipefail
          python scripts/kenney-mirror-import.py --mode verify
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("content/sound-library.json").read_text())
          assert m["exactFileCount"]==151
          assert m["packs"]["ui-audio"]["mirrorObserved"]==51
          assert m["packs"]["ui-audio"]["publisherListed"]==50
          assert m["packs"]["ui-audio"]["countDiscrepancy"] is True
          assert m["packs"]["interface-sounds"]["mirrorObserved"]==100
          assert m["automaticallyUsedInProduction"] is False
          assert m["aiApiConnected"] is False
          print("SoundKit pinned raw asset integrity OK; not enabled in video production")
          PY
