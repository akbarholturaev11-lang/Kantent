name: One-shot independent Mandarin ASR cross-check (PR 46)

# Offline open model; read-only. No Gemini API, TTS calls, publishing or merge.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  independent-asr:
    if: >-
      ${{ github.event.pull_request.number == 46 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/continuous-gemini-tts-pilot-20261031' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hsk-tu-vous
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuous-gemini-tts-pilot-20261031
      - uses: actions/download-artifact@v4
        with:
          run-id: 41183287146
          name: gemini-continuous-pr46-ru-41183287146
          github-token: ${{ github.token }}
          path: hsk-tu-vous/review
      - uses: actions/download-artifact@v4
        with:
          run-id: 41183287146
          name: gemini-continuous-pr46-tg-41183287146
          github-token: ${{ github.token }}
          path: hsk-tu-vous/review
      - uses: actions/download-artifact@v4
        with:
          run-id: 41190035220
          name: pr46-all-mandarin-ru-tg-41190035220
          github-token: ${{ github.token }}
          path: hsk-tu-vous/diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source CPU model only
        run: |
          python -m pip install --quiet numpy soundfile
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet qwen-asr
      - name: Independently recognize 20 Mandarin source clips without text hints
        run: |
          python scripts/independent-mandarin-asr-probe.py \
            --review review \
            --evidence diagnostics/model-coverage.json \
            --out /tmp/hsk-independent-asr/asr-source-check.json
      - name: Archive recognized source words and discrepancies only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr46-mandarin-audible-crosscheck-${{ github.run_id }}
          path: /tmp/hsk-independent-asr/
          if-no-files-found: warn
          retention-days: 7
