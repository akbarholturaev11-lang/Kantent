name: HSK AI read-only Zernio schedule timing
run-name: Zernio timing ${{ inputs.language }} ${{ inputs.platform }} for ${{ inputs.target_date }}

# Manual, owner-only analytics. This workflow never uploads or publishes media.
on:
  workflow_dispatch:
    inputs:
      language:
        description: "Exact language/account route from publication-destinations.json"
        required: true
        type: choice
        options: [ru, tg]
      platform:
        description: "One exact connected account to analyze"
        required: true
        type: choice
        options: [instagram, youtube, tiktok, facebook]
      target_date:
        description: "Local publication date in the canonical calendar timezone (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hsk-zernio-timing-${{ inputs.language }}-${{ inputs.platform }}-${{ inputs.target_date }}
  cancel-in-progress: false

jobs:
  read-analytics:
    if: ${{ github.actor == 'akbarholturaev11-lang' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hsk-zernio-publishing
    defaults:
      run:
        working-directory: hsk-tu-vous
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the read-only analytics script
        run: node --check scripts/zernio-schedule-timing.mjs
      - name: Read exact-account engagement and activity data
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_RU_API_KEY: ${{ secrets.ZERNIO_RU_API_KEY }}
          ZERNIO_TG_API_KEY: ${{ secrets.ZERNIO_TG_API_KEY }}
          ZERNIO_TIKTOK_TELEGRAM_API_KEY: ${{ secrets.ZERNIO_TIKTOK_TELEGRAM_API_KEY }}
          ZERNIO_TIKTOK_FACEBOOK_API_KEY: ${{ secrets.ZERNIO_TIKTOK_FACEBOOK_API_KEY }}
          ZERNIO_RU_INSTAGRAM_ACCOUNT_ID: ${{ vars.ZERNIO_RU_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_RU_YOUTUBE_ACCOUNT_ID: ${{ vars.ZERNIO_RU_YOUTUBE_ACCOUNT_ID }}
          ZERNIO_RU_TIKTOK_ACCOUNT_ID: ${{ vars.ZERNIO_RU_TIKTOK_ACCOUNT_ID }}
          ZERNIO_RU_FACEBOOK_ACCOUNT_ID: ${{ vars.ZERNIO_RU_FACEBOOK_ACCOUNT_ID }}
          ZERNIO_TG_INSTAGRAM_ACCOUNT_ID: ${{ vars.ZERNIO_TG_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_TG_YOUTUBE_ACCOUNT_ID: ${{ vars.ZERNIO_TG_YOUTUBE_ACCOUNT_ID }}
          ZERNIO_TG_TIKTOK_ACCOUNT_ID: ${{ vars.ZERNIO_TG_TIKTOK_ACCOUNT_ID }}
          ZERNIO_TG_FACEBOOK_ACCOUNT_ID: ${{ vars.ZERNIO_TG_FACEBOOK_ACCOUNT_ID }}
          ZERNIO_TIME_LANGUAGE: ${{ inputs.language }}
          ZERNIO_TIME_PLATFORM: ${{ inputs.platform }}
          ZERNIO_TIME_TARGET_DATE: ${{ inputs.target_date }}
          ZERNIO_TIME_OUTPUT: /tmp/zernio-schedule-timing.json
        run: |
          umask 077
          node scripts/zernio-schedule-timing.mjs | tee /tmp/zernio-schedule-timing.log
          cat /tmp/zernio-schedule-timing.log >> "$GITHUB_STEP_SUMMARY"
      - name: Save sanitized timing report
        uses: actions/upload-artifact@v4
        with:
          name: zernio-schedule-timing-${{ inputs.language }}-${{ inputs.platform }}-${{ inputs.target_date }}-${{ github.run_id }}
          path: /tmp/zernio-schedule-timing.json
          if-no-files-found: error
          retention-days: 7
