name: HSK Oct 30 CTA preregistration (isolated branch)
on:
  push:
    branches:
      - run/2026-10-30-hsk-review
    paths:
      - .github/workflows/hsk-repair-cta-20261030.yml
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/2026-10-30-hsk-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hsk-tu-vous/package-lock.json
      - name: Install project dependencies
        working-directory: hsk-tu-vous
        run: npm ci --no-audit --no-fund
      - name: Register existing approved RU and TG CTA without modifying copy, voice or main
        working-directory: hsk-tu-vous
        run: |
          node --input-type=module <<'NODE'
          import {withLanguage} from './scripts/language-context.mjs';
          import {getPlannedEpisode} from './scripts/lib.mjs';
          import {readCtaLab,writeCtaLab,getActiveCtaCorrections,createCtaExperiment,validateCtaEpisode,ctaExperimentMetadata} from './scripts/cta-lab.mjs';
          for(const language of ['ru','tg']){
            await withLanguage(language, async () => {
              const {episode}=await getPlannedEpisode('2026-10-30');
              const lab=await readCtaLab();
              const id=episode.id+'-'+language+'-cta-v1';
              if(lab.experiments.some(x=>x.id===id))throw Error('Registration already exists: '+id);
              const active=getActiveCtaCorrections(lab,{episodeId:episode.id,formatId:'benefit-profile-link-download'});
              const registration=createCtaExperiment({lab,episode,id,acknowledgedCorrectionIds:active.map(x=>x.id),hypothesis:'Register the existing owner-approved profile-link HSK AI download CTA on the October 30 price-expression lesson without changing wording or visuals. No performance lift is claimed.',changedVariable:'baseline'});
              lab.experiments.push(registration);
              const saved=await writeCtaLab(lab);
              episode.ctaExperiment=ctaExperimentMetadata(registration);
              const validation=validateCtaEpisode(episode,saved);
              if(!validation.valid)throw Error(language+' CTA validation: '+validation.errors.join('; '));
              console.log(JSON.stringify({language,episodeId:episode.id,registration:id,revision:saved.revision,acknowledged:active.map(x=>x.id),valid:true}));
            });
          }
          NODE
      - name: Verify canonical consistency and append-only ledger
        working-directory: hsk-tu-vous
        run: npm run check:consistency
      - name: Commit only the RU/TG CTA ledger registrations to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hsk-tu-vous/content/cta-lab.json hsk-tu-vous/content/locales/tg/cta-lab.json
          git diff --cached --check
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "fix(content): preregister approved Oct 30 RU/TG lesson CTAs"
          git push origin HEAD:run/2026-10-30-hsk-review
